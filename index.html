<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight – study from your own notes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body{background:#0E1330;color:#E8EAF6}h1,h2{font-family:Fraunces,Georgia,serif}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const api=async(u,o)=>{const r=await fetch(u,o);if(!r.ok){let m="Something went wrong";try{m=(await r.json()).detail||m}catch{}throw new Error(m)}return r.json()};
const post=(u,b)=>api(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
const btn="px-4 py-2 rounded-xl bg-[#F2D57E] text-[#0E1330] font-semibold disabled:opacity-50";
const box="p-4 rounded-2xl bg-[#161C42] border border-[#2A3270]";

function Upload({onDone}){
 const [busy,setBusy]=useState(false),[err,setErr]=useState("");
 const go=async f=>{if(!f)return;setBusy(true);setErr("");const fd=new FormData();fd.append("file",f);
  try{onDone(await api("/api/upload",{method:"POST",body:fd}))}catch(e){setErr(e.message)}setBusy(false)};
 return <label className="block border-2 border-dashed border-[#F2D57E]/50 rounded-2xl p-10 text-center cursor-pointer hover:bg-[#F2D57E]/5">
  <input type="file" accept=".pdf,.docx,.txt" className="hidden" onChange={e=>go(e.target.files[0])}/>
  {busy?"Reading and indexing your notes…":"Choose a PDF, DOCX or TXT file"}
  {err&&<p className="text-red-400 mt-2">{err}</p>}</label>}

function Chat({doc}){
 const [msgs,setMsgs]=useState([]),[q,setQ]=useState(""),[busy,setBusy]=useState(false),end=useRef();
 useEffect(()=>{api("/api/history/"+doc.id).then(setMsgs)},[doc.id]);
 useEffect(()=>{end.current&&end.current.scrollIntoView()},[msgs]);
 const send=async()=>{if(!q.trim()||busy)return;const t=q;setQ("");setBusy(true);setMsgs(m=>[...m,{role:"user",content:t}]);
  try{const r=await post("/api/chat",{doc_id:doc.id,question:t});setMsgs(m=>[...m,{role:"assistant",...r}])}
  catch(e){setMsgs(m=>[...m,{role:"assistant",content:e.message,sources:[]}])}setBusy(false)};
 return <div>
  <div className="space-y-3 mb-3">{msgs.length===0&&<p className="text-[#8B93C4]">Ask anything about {doc.name}.</p>}
   {msgs.map((m,i)=><div key={i} className={m.role==="user"?"ml-10 "+box+" bg-[#232B63]":box}>
    <p className="whitespace-pre-wrap">{m.content}</p>
    {m.sources&&m.sources.length>0&&<div className="flex flex-wrap gap-2 mt-2">{m.sources.map(s=>
     <span key={s.page} title={s.snippet} className="text-xs px-2 py-1 rounded-full bg-[#F2D57E]/15 text-[#F2D57E]">Page {s.page}</span>)}</div>}
   </div>)}{busy&&<p className="text-[#8B93C4]">Searching your notes…</p>}<div ref={end}/></div>
  <div className="flex gap-2"><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
   placeholder="What is supervised learning?" className="flex-1 px-3 py-2 rounded-xl bg-[#161C42] border border-[#2A3270] outline-none focus:border-[#F2D57E]"/>
   <button className={btn} onClick={send} disabled={busy}>Ask</button></div></div>}

function Tool({doc,name,children}){
 const [d,setD]=useState(null),[busy,setB]=useState(false),[e,setE]=useState("");
 const run=async()=>{setB(true);setE("");try{setD((await post("/api/tool/"+name,{doc_id:doc.id})).result)}catch(x){setE(x.message)}setB(false)};
 return <div>{!d&&<button className={btn} disabled={busy} onClick={run}>{busy?"Generating…":"Generate "+name}</button>}
  {e&&<p className="text-red-400 mt-2">{e}</p>}{d&&<div>{children(d)}<button className="mt-4 text-sm underline text-[#8B93C4]" onClick={run}>Regenerate</button></div>}</div>}

function Card({c}){const [f,setF]=useState(false);
 return <div onClick={()=>setF(!f)} className={box+" cursor-pointer min-h-[110px]"}>
  {f?<><p className="text-[#F2D57E]">{c.a}</p><p className="text-xs text-[#8B93C4] mt-2">Page {c.page}</p></>:<p>{c.q}</p>}</div>}

function Quiz({qs}){
 const [ans,setAns]=useState({}),[done,setDone]=useState(false);
 const score=qs.filter((q,i)=>ans[i]===q.answer_index).length;
 return <div className="space-y-4">{qs.map((q,i)=><div key={i} className={box}>
  <p className="font-medium mb-2">{i+1}. {q.question}</p>
  {q.options.map((o,j)=>{const p=ans[i]===j;
   const c=done?(j===q.answer_index?"border-emerald-400":p?"border-red-400":"border-[#2A3270]"):(p?"border-[#F2D57E]":"border-[#2A3270]");
   return <button key={j} disabled={done} onClick={()=>setAns({...ans,[i]:j})} className={"block w-full text-left p-2 mb-1 rounded-lg border "+c}>{o}</button>})}
  {done&&<p className="text-sm text-[#8B93C4] mt-2">{q.explanation} (Page {q.page})</p>}</div>)}
  {!done?<button className={btn} onClick={()=>setDone(true)}>Check answers</button>:<p className="text-2xl font-bold">Score: {score}/{qs.length}</p>}</div>}

const TABS=["chat","summary","flashcards","quiz","topics"];
function App(){
 const [docs,setDocs]=useState([]),[doc,setDoc]=useState(null),[tab,setTab]=useState("chat");
 useEffect(()=>{api("/api/docs").then(setDocs)},[]);
 const added=d=>{setDocs([d,...docs]);setDoc(d);setTab("chat")};
 return <div className="max-w-3xl mx-auto p-4 sm:p-8">
  <h1 className="text-4xl font-bold mb-1 cursor-pointer" onClick={()=>setDoc(null)}>Midnight</h1>
  <p className="text-[#8B93C4] mb-6">Study from your own notes. Every answer shows its page.</p>
  {!doc?<div className="space-y-6"><Upload onDone={added}/>
   {docs.length>0&&<div><h2 className="text-xl mb-2">Your documents</h2><div className="space-y-2">{docs.map(d=>
    <button key={d.id} onClick={()=>{setDoc(d);setTab("chat")}} className={box+" block w-full text-left"}>{d.name} <span className="text-[#8B93C4]">· {d.pages} pages</span></button>)}</div></div>}</div>
  :<div><div className="flex items-center justify-between mb-4"><h2 className="text-xl truncate">{doc.name}</h2>
    <button className="text-sm underline text-[#8B93C4]" onClick={()=>setDoc(null)}>All documents</button></div>
   <div className="flex gap-2 overflow-x-auto mb-4">{TABS.map(t=><button key={t} onClick={()=>setTab(t)}
    className={"px-3 py-1.5 rounded-full capitalize whitespace-nowrap "+(tab===t?"bg-[#F2D57E] text-[#0E1330]":"bg-[#161C42]")}>{t}</button>)}</div>
   {tab==="chat"&&<Chat doc={doc}/>}
   {tab==="summary"&&<Tool key={doc.id} doc={doc} name="summary">{d=><div className={box+" whitespace-pre-wrap"}>{d}</div>}</Tool>}
   {tab==="flashcards"&&<Tool key={doc.id} doc={doc} name="flashcards">{d=><div className="grid sm:grid-cols-2 gap-3">{d.map((c,i)=><Card key={i} c={c}/>)}</div>}</Tool>}
   {tab==="quiz"&&<Tool key={doc.id} doc={doc} name="quiz">{d=><Quiz qs={d}/>}</Tool>}
   {tab==="topics"&&<Tool key={doc.id} doc={doc} name="topics">{d=><div className="space-y-2">{d.map((t,i)=><div key={i} className={box}><b>{t.topic}</b> <span className="text-[#F2D57E] text-sm">Page {t.page}</span><p className="text-[#8B93C4]">{t.why}</p></div>)}</div>}</Tool>}
  </div>}</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
